<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Formen sortieren – Klasse 1</title>
<style>
:root{--ink:#23314f;--sky:#cfe6f5;--gold:#ffc53d;--s:110px}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--sky);color:var(--ink);font-family:"Arial Rounded MT Bold","Trebuchet MS",Verdana,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
header{display:flex;align-items:center;gap:16px;padding:12px 20px;height:84px}
h1{font-size:clamp(20px,2.4vw,40px);margin:0;flex:1}
#stat{font-size:clamp(16px,1.6vw,26px)}
button,label.sw{font:inherit;font-size:clamp(16px,1.6vw,26px);min-height:56px;padding:0 22px;border:4px solid var(--ink);border-radius:18px;background:var(--gold);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:10px}
label.sw{background:#fff}
label.sw input{width:28px;height:28px;accent-color:var(--ink)}
button:active{transform:translateY(2px)}
button:focus-visible,label.sw:focus-within{outline:4px solid #2e86de;outline-offset:3px}
main{flex:1;position:relative;min-height:0}
#table{position:absolute;inset:0 0 40vh 0}
#bins{position:absolute;left:20px;right:20px;bottom:20px;height:calc(40vh - 20px);display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.bin{background:#fff;border:6px solid var(--ink);border-radius:26px;display:flex;flex-direction:column;overflow:hidden;transition:background .15s,transform .15s}
.bin.over{background:#fff0b8;transform:scale(1.02)}
.bin h2{margin:0;display:flex;align-items:center;gap:14px;padding:10px 18px;font-size:clamp(22px,2.6vw,46px);border-bottom:4px dashed #b9c6dd}
.bin h2 svg{width:1.3em;height:1.3em;flex:none}
.pile{flex:1}
#shapes{position:fixed;inset:0;pointer-events:none;z-index:5}
.sh{position:absolute;width:var(--s);height:var(--s);pointer-events:auto;cursor:grab;touch-action:none;transform-origin:0 0;transition:left .35s,top .35s,transform .25s;filter:drop-shadow(0 4px 0 rgba(35,49,79,.18))}
.sh svg{width:100%;height:100%;display:block;overflow:visible}
.sh.in{transform:scale(.8)}
.sh.drag{transition:none;transform:translate(-7.5%,-7.5%) scale(1.15);filter:drop-shadow(0 12px 10px rgba(35,49,79,.3));cursor:grabbing}
.sh.ok::after,.sh.bad::after{position:absolute;right:-6px;top:-6px;width:36px;height:36px;border-radius:50%;border:3px solid #fff;color:#fff;display:grid;place-items:center;font-size:22px}
.sh.ok::after{content:"✓";background:#3bb273}
.sh.bad::after{content:"✗";background:#e4572e}
.sh.bad svg{animation:shake .5s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
#win{position:fixed;inset:0;display:none;place-items:center;z-index:100;background:rgba(35,49,79,.45)}
#win.show{display:grid}
#win div{background:#fff;border:8px solid var(--ink);border-radius:36px;padding:40px 70px;font-size:clamp(36px,6vw,110px);text-align:center}
@media (prefers-reduced-motion:reduce){.sh,.bin{transition:none}.sh.bad svg{animation:none}}
</style>
</head>
<body>
<header>
  <h1>Sortiere die Formen!</h1>
  <span id="stat"></span>
  <label class="sw"><input type="checkbox" id="fast"> sofort prüfen</label>
  <button id="check">✓ Prüfen</button>
  <button id="reset">↻ Neu mischen</button>
</header>
<main><div id="table"></div><div id="bins"></div></main>
<div id="shapes"></div>
<div id="win"><div>Geschafft! ⭐</div></div>
<script>
const COL={r:'#e4572e',g:'#f6c324',b:'#2e86de',n:'#3bb273',o:'#f28c28',v:'#8e5bd0',p:'#ee6f9c',t:'#19b5c4'};
const poly=p=>`<polygon points="${p}"/>`;
const DEF={
 dreieck:[[poly('50,8 94,88 6,88'),'g'],[poly('6,14 94,14 50,92'),'t'],[poly('10,10 10,90 90,90'),'p'],[poly('4,80 96,80 50,22'),'o']],
 kreis:[['<circle cx="50" cy="50" r="46"/>','r'],['<circle cx="50" cy="50" r="36"/>','b'],['<circle cx="50" cy="50" r="28"/>','n'],['<circle cx="50" cy="50" r="42"/>','v']],
 rechteck:[['<rect x="6" y="26" width="88" height="48"/>','b'],['<rect x="26" y="6" width="48" height="88"/>','o'],['<rect x="4" y="35" width="92" height="30"/>','r'],['<rect x="20" y="10" width="56" height="80"/>','n']],
 quadrat:[['<rect x="8" y="8" width="84" height="84"/>','p'],['<rect x="20" y="20" width="60" height="60"/>','v'],['<rect x="14" y="14" width="72" height="72"/>','t'],['<rect x="28" y="28" width="44" height="44"/>','g']]
};
const ICON={dreieck:poly('50,12 92,86 8,86'),kreis:'<circle cx="50" cy="50" r="40"/>',rechteck:'<rect x="6" y="26" width="88" height="48"/>',quadrat:'<rect x="14" y="14" width="72" height="72"/>'};
const NAMES={dreieck:'Dreieck',kreis:'Kreis',rechteck:'Rechteck',quadrat:'Quadrat'};
const $=s=>document.querySelector(s);
let S=110,z=10,cur=null;

const bins=Object.keys(NAMES).map(k=>{
  const el=document.createElement('div');el.className='bin';
  el.innerHTML=`<h2><svg viewBox="0 0 100 100" fill="none" stroke="#23314f" stroke-width="7" stroke-linejoin="round">${ICON[k]}</svg>${NAMES[k]}</h2><div class="pile"></div>`;
  $('#bins').append(el);
  return{k,el,pile:el.querySelector('.pile'),items:[]};
});
const shapes=[];
Object.entries(DEF).forEach(([k,list])=>list.forEach(([svg,c])=>{
  const el=document.createElement('div');el.className='sh';
  el.innerHTML=`<svg viewBox="0 0 100 100" fill="${COL[c]}" stroke="#23314f" stroke-width="3.5" stroke-linejoin="round">${svg}</svg>`;
  $('#shapes').append(el);
  const o={k,el,bin:null,x:0,y:0};shapes.push(o);
  el.addEventListener('pointerdown',e=>down(e,o));
  el.addEventListener('pointermove',e=>{if(cur===o)move(e)});
  el.addEventListener('pointerup',e=>{if(cur===o)up(e)});
  el.addEventListener('pointercancel',e=>{if(cur===o)up(e)});
}));

const tr=()=>$('#table').getBoundingClientRect();
function size(){S=Math.round(Math.min(170,Math.max(80,innerWidth*.075)));document.documentElement.style.setProperty('--s',S+'px')}
function put(o,x,y){o.x=x;o.y=y;o.el.style.left=x+'px';o.el.style.top=y+'px'}
function clampT(x,y){const r=tr(),m=10;return[Math.min(Math.max(x,r.left+m),r.right-S-m),Math.min(Math.max(y,r.top+m),r.bottom-S-m)]}
function layoutBin(b){
  const r=b.pile.getBoundingClientRect(),c=S*.8,cols=Math.max(1,Math.floor((r.width-16)/c)),rows=Math.ceil(b.items.length/cols);
  const sy=rows>1&&rows*c>r.height-8?(r.height-8-c)/(rows-1):c;
  b.items.forEach((o,i)=>{o.el.classList.add('in');put(o,r.left+10+(i%cols)*c,r.top+4+Math.floor(i/cols)*sy)});
}
function scatter(list){
  if(list.length===shapes.length){
    const r=tr();let best=null;
    for(let rows=1;rows<=4;rows++){
      const cols=Math.ceil(list.length/rows),cw=r.width/cols,ch=r.height/rows;
      if(rows>1&&ch<S*1.05)continue;
      const sc=Math.abs(Math.log(cw/ch))+(cols*rows-list.length)*.3;
      if(!best||sc<best.sc)best={rows,cols,cw,ch,sc};
    }
    const cells=[];
    for(let i=0;i<best.rows;i++)for(let j=0;j<best.cols;j++)cells.push([i,j]);
    cells.sort(()=>Math.random()-.5);
    const order=[...list].sort(()=>Math.random()-.5);
    order.forEach((o,n)=>{
      const[i,j]=cells[n];
      const jx=(Math.random()-.5)*Math.max(0,best.cw-S-20)*.8,jy=(Math.random()-.5)*Math.max(0,best.ch-S-20)*.8;
      const[x,y]=clampT(r.left+(j+.5)*best.cw-S/2+jx,r.top+(i+.5)*best.ch-S/2+jy);
      o.bin=null;o.el.classList.remove('in','ok','bad');put(o,x,y);
    });
    return;
  }
  const r=tr(),pts=shapes.filter(o=>!o.bin&&!list.includes(o)).map(o=>[o.x,o.y]);
  list.forEach(o=>{
    let x,y,n=0;
    do{[x,y]=clampT(r.left+Math.random()*r.width,r.top+Math.random()*r.height);n++}
    while(n<60&&pts.some(p=>Math.hypot(p[0]-x,p[1]-y)<S*.95));
    pts.push([x,y]);o.bin=null;o.el.classList.remove('in','ok','bad');put(o,x,y);
  });
}
const binAt=(x,y)=>bins.find(b=>{const r=b.el.getBoundingClientRect();return x>r.left&&x<r.right&&y>r.top&&y<r.bottom});
const allOk=()=>shapes.every(o=>o.bin&&o.bin.k===o.k);

function down(e,o){
  e.preventDefault();cur=o;
  if(o.bin){const b=o.bin;b.items=b.items.filter(i=>i!==o);o.bin=null;layoutBin(b)}
  o.el.classList.remove('in','ok','bad');o.el.classList.add('drag');o.el.style.zIndex=++z;
  o.el.setPointerCapture(e.pointerId);move(e);status();
}
function move(e){
  put(cur,e.clientX-S/2,e.clientY-S/2);
  const h=binAt(e.clientX,e.clientY);bins.forEach(b=>b.el.classList.toggle('over',b===h));
}
function up(e){
  const o=cur;cur=null;o.el.classList.remove('drag');bins.forEach(b=>b.el.classList.remove('over'));
  const b=binAt(e.clientX,e.clientY);
  if(b){o.bin=b;b.items.push(o);layoutBin(b);if($('#fast').checked)setTimeout(()=>judge(o),350)}
  else{const[x,y]=clampT(o.x,o.y);put(o,x,y)}
  status();
}
function judge(o){
  if(!o.bin)return;
  const ok=o.bin.k===o.k;o.el.classList.add(ok?'ok':'bad');
  if(!ok)setTimeout(()=>{
    if(!o.el.classList.contains('bad')||!o.bin)return;
    const b=o.bin;b.items=b.items.filter(i=>i!==o);layoutBin(b);scatter([o]);status();
  },900);
  else if($('#fast').checked&&allOk())win();
}
function status(text){
  const left=shapes.filter(o=>!o.bin).length;
  $('#stat').textContent=text||(left?`Noch auf dem Tisch: ${left}`:'');
}
function win(){$('#win').classList.add('show')}

$('#check').onclick=()=>{
  shapes.forEach(judge);
  const n=shapes.filter(o=>o.bin&&o.bin.k===o.k).length;
  status(`${n} von ${shapes.length} richtig`);
  if(allOk())win();
};
$('#reset').onclick=()=>{
  bins.forEach(b=>b.items=[]);scatter(shapes);
  $('#win').classList.remove('show');status();
};
$('#win').onclick=()=>$('#win').classList.remove('show');

function relayout(){
  size();
  shapes.filter(o=>!o.bin&&o!==cur).forEach(o=>{const[x,y]=clampT(o.x,o.y);put(o,x,y)});
  bins.forEach(layoutBin);
}
addEventListener('resize',relayout);
size();scatter(shapes);status();
</script>
</body>
</html>
